# Group project - one repo per team, one result per team.
# `type: group` makes the collector iterate over teams (from classroom-config/teams.csv)
# rather than over students. It records how many hidden tests the team's submission passed
# in `autograde_score` - the same column an individual assignment uses, on every member's
# row. `team_score` is yours: the shared mark you set for the team. Each member's private
# `individual_adjustment` and the shared `team_comments` are filled by hand afterwards.
#
# The hidden tests are STRUCTURAL only - required files, headings, placeholders replaced,
# a `run_pipeline` entry point, pinned dependencies, a fixed seed. They are a completeness
# floor; the 25 marks are hand-marked against the rubric in the brief.
type: group
autograde: true
tests: tests
